name: Frontend CI

on:
  push:
    branches: [main, introduce-to-ci]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Check frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate HTML
        run: npx --yes html-validate@9 "frontend/**/*.html"

      - name: Check CSS syntax
        run: npx --yes stylelint@16 "frontend/**/*.css"

      - name: Check JavaScript syntax
        run: |
          find frontend -name "*.js" -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
